version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: build/einksync.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: einksync
    bump: patch

build:
  toolchains: []
  run_buildscript: false

images:
  - id: einksync
    target: service
    service: einksync
    source: docker.io/xiaokun566/einksync
    channel: custom
    sort: created
    tag_regex: '^latest$'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    create_if_missing: true
    changelog_locales: [zh, en]
    retry:
      enabled: false
      max_attempts: 3
      initial_delay: 2s
      max_delay: 30s
    application:
      language: zh
      name: EinkSync
      source: https://github.com/xiaokun567/EinkSync
      source_author: xiaokun567
  private:
    enabled: true
    skip_if_version_exists: true
    name: EinkSync
    summary: "EinkSync LazyCat package published from GitHub Actions."
