version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: build/einksync.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: einksync
    bump: patch

build:
  toolchains: []
  run_buildscript: false

images:
  - id: einksync
    target: service
    service: einksync
    source: docker.io/xiaokun566/einksync
    channel: custom
    sort: created
    tag_regex: '^latest$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: EinkSync
    summary: "EinkSync LazyCat package published from GitHub Actions."
