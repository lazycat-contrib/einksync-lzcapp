application:
  subdomain: einksync
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://einksync:5000/
services:
  einksync:
    #  xiaokun566/einksync:latest
    # upstream: docker.io/xiaokun566/einksync:latest@sha256:15add08548ddbfb3f6af46eee67788e48025765c893ded3578c7c63ff4944de3
    image: registry.lazycat.cloud/czyt/xiaokun566/einksync:995dd00fd0bf19b3
    binds:
      - /lzcapp/var/data:/app/data
      - /lzcapp/var/downloads:/app/downloads
      - /lzcapp/var/library:/app/library
