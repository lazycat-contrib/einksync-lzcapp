name: EinkSync
package: community.lazycat.app.einksync
version: 0.1.0
min_os_version: 1.3.8
homepage: https://github.com/xiaokun567/EinkSync
description: 专为墨水屏打造的阅读伴侣
author: xiaokun567
application:
  subdomain: einksync
  background_task: true
  public_path:
    - /

  upstreams:
    - location: /
      backend: http://einksync:5000/

services:
  einksync:
    #  xiaokun566/einksync:latest
    image: registry.lazycat.cloud/czyt/xiaokun566/einksync:b41cad9e6ac42654
    binds:
      - /lzcapp/var/data:/app/data
      - /lzcapp/var/downloads:/app/downloads
      - /lzcapp/var/library:/app/library

locales:
  zh:
    name: "EinkSync"
    description: "专为墨水屏打造的阅读伴侣"
  en:
    name: "EinkSync"
    description: "a reading companion for e-ink screens"
