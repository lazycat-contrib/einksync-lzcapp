application:
  subdomain: einksync
  background_task: true
  public_path:
    - /

  upstreams:
    - location: /
      backend: http://einksync:5000/

services:
  einksync:
    #  xiaokun566/einksync:latest
    image: registry.lazycat.cloud/czyt/xiaokun566/einksync:b41cad9e6ac42654
    binds:
      - /lzcapp/var/data:/app/data
      - /lzcapp/var/downloads:/app/downloads
      - /lzcapp/var/library:/app/library
