application:
  subdomain: einksync
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://einksync:5000/
services:
  einksync:
    #  xiaokun566/einksync:latest
    # upstream: docker.io/xiaokun566/einksync:latest@sha256:a7ac6fad99d981d7692b642f8bfd3be278b122bb6bd6061ce22e4ba709a6d55c
    image: registry.lazycat.cloud/czyt/xiaokun566/einksync:dab5859822c5fb6f
    binds:
      - /lzcapp/var/data:/app/data
      - /lzcapp/var/downloads:/app/downloads
      - /lzcapp/var/library:/app/library
