application:
  subdomain: einksync
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://einksync:5000/
services:
  einksync:
    #  xiaokun566/einksync:latest
    # upstream: docker.io/xiaokun566/einksync:latest@sha256:9e66b6e8c7f669b8960628e50d3b77d293716dcefd871f29fbc9049fa9bdeff6
    image: docker.1ms.run/xiaokun566/einksync:latest@sha256:9e66b6e8c7f669b8960628e50d3b77d293716dcefd871f29fbc9049fa9bdeff6
    binds:
      - /lzcapp/var/data:/app/data
      - /lzcapp/var/downloads:/app/downloads
      - /lzcapp/var/library:/app/library
